window.CONTENT.topics.push({id:2,title:"2-§. Eng qadimgi odamlarning rivojlanish bosqichlari",guide:"<h2>1. ENG QADIMGI ODAMLAR</h2>\n<p>Tarix fanida eng qadimgi odamlar ibtidoiy odamlar deb ataladi.</p>\n<p>Yer yuzidagi dastlabki odamlarning asosiy xususiyatlari:</p>\n<ul><li>qaddi-qomatini tik tutib yurgan;</li><li>mehnat qurollarini yasashni bilgan;</li><li>mehnat qurollaridan foydalangan;</li><li>ular yordamida tabiatdan yegulik topgan.</li></ul>\n<p>Eng qadimgi odamlarning ilk vatani</p>\n<p>Olimlar eng qadimgi odam suyaklari qoldiqlarini Sharqiy Afrikadan topib o‘rgangan.</p>\n<ul><li>Yoshi: 2 million yildan oshadi.</li><li>Olimlar uni “ishbilarmon odam” deb atashgan.</li><li>Buning sababi: u toshdan o‘ta sodda mehnat qurollari yasashni bilgan.</li></ul>\n<blockquote>Test uchun eslab qoling: Sharqiy Afrika → 2 mln yildan ortiq → ishbilarmon odam → sodda tosh qurollar.</blockquote>\n<h2>2. “TIK YURUVCHI ODAM”</h2>\n<p>Mingyilliklar davomida odamning tashqi qiyofasi, ko‘nikmalari va miya hajmi o‘zgarib borgan.</p>\n<p>Keyingi bosqichda “tik yuruvchi odam” vujudga kelgan.</p>\n<p>Uning asosiy xususiyatlari:</p>\n<ul><li>tanasi ancha baquvvat bo‘lgan;</li><li>turli tosh qurollarni yasash ko‘nikmasiga ega bo‘lgan;</li><li>tabiiy olovdan foydalanishni bilib olgan;</li><li>yashash joylarini o‘zgartirib, keng hududlarga tarqalgan.</li></ul>\n<p>“Tik yuruvchi odam” izlari</p>\n<p>Ularning makonlari va suyak qoldiqlari:</p>\n<ul><li>Afrika;</li><li>Yevropa;</li><li>Osiyo</li></ul>\n<p>hududlaridan topilgan.</p>\n<blockquote>Muhim bog‘lanish: Tik yuruvchi odam → baquvvat → turli tosh qurollar → tabiiy olov → keng hududlarga tarqalish.</blockquote>\n<p>Olov</p>\n<p>“Tik yuruvchi odamlar” chaqmoq zarbidan yong‘in chiqqan o‘rmondagi tabiiy olovdan foydalanishni bilib olgan.</p>\n<p>Shuning uchun:</p>\n<p>Ilk marta tabiiy olovdan foydalanish → “tik yuruvchi odam”.</p>\n<p>Bu ma’lumotni sun’iy olov bilan aralashtirmang. Berilgan mavzuda “tik yuruvchi odam” tabiiy olovdan foydalangani aytilgan.</p>\n<h2>3. IQLIM O‘ZGARISHI VA BUYUK MUZLIK DAVRI</h2>\n<p>Yer yuzida iqlim iliq bo‘lgan davrlarda odamlar:</p>\n<p>mayda daryolar yoki buloqlar yaqinidagi tepaliklarni makon qilgan.</p>\n<p>Buyuk muzlik davri</p>\n<p>Ilk paleolit davrining oxirlariga kelib Buyuk muzlik davri boshlangan.</p>\n<p>Sovuq tobora kuchaygan.</p>\n<p>Natijada qadimgi odamlar:</p>\n<ul><li>yangi iqlim sharoitiga moslashishga;</li><li>issiqroq va pana joylarni izlashga;</li><li>olis makonlarga ko‘chishga majbur bo‘lgan.</li></ul>\n<blockquote>Test zanjiri: Ilk paleolit oxiri → Buyuk muzlik davri → sovuq kuchaydi → odamlar issiqroq va pana joylar izlab ko‘chdi.</blockquote>\n<h2>4. ENG QADIMGI ODAMLARNING MASHG‘ULOTLARI</h2>\n<p>Odamlar dastlab tabiatda mavjud narsalardan foydalangan.</p>\n<p>O‘rta Osiyodagi qadimiy mehnat qurollari</p>\n<table><tr><th>Manzilgoh</th><th>Joylashuvi</th></tr><tr><td>Selungur</td><td>Farg‘ona vodiysi</td></tr><tr><td>Ko‘lbuloq</td><td>Toshkent viloyati</td></tr></table>\n<p>Bu joylardan topilgan qurollar:</p>\n<ul><li>qo‘pol tosh qurollar;</li><li>bir tomoni urib o‘tkirlangan;</li><li>chopperlar deb ataladi.</li></ul>\n<p>Chopper</p>\n<p>Bir tomoni urib o‘tkirlangan qo‘pol tosh qurol → chopper.</p>\n<p>Shuni boshqa tosh qurollar bilan aralashtirmang.</p>\n<h2>5. O‘ZLASHTIRUVCHI XO‘JALIK</h2>\n<p>Dastlabki mehnat qurollari odamlarga yegulik topish uchun kerak bo‘lgan.</p>\n<p>Odamlar:</p>\n<ul><li>uchi o‘tkirlangan tosh va tayoq bilan hayvonlarni ovlagan;</li><li>o‘simliklarning iste’molga yaroqli ildizmevalarini kovlab olgan.</li></ul>\n<p>Tabiat nimani in’om etsa, odam shuni olgan va topgan yeguligi bilan qanoatlangan.</p>\n<p>Shuning uchun eng qadimiy mashg‘ulotlar:</p>\n<p>meva-ildizlarni terish + ov qilish = o‘zlashtiruvchi xo‘jalik.</p>\n<p>Eslab qolish formulasi:</p>\n<p><b>TERISH + OV → O‘ZLASHTIRUVCHI XO‘JALIK</b></p>\n<p>O‘zlashtiruvchi xo‘jalikda odam tabiatdan tayyor mahsulotni oladi.</p>\n<h2>6. TEShIKTOSH G‘ORI</h2>\n<p>Teshiktosh g‘ori:</p>\n<ul><li>Boysun tog‘larida joylashgan;</li><li>o‘rta paleolit davriga tegishli;</li><li>mil. avv. 100–40-mingyilliklarga oid;</li><li>jahonga mashhur yodgorlik hisoblanadi.</li></ul>\n<p>Teshiktoshdan:</p>\n<ul><li>tosh qurollar;</li><li>tosh qurollarning parchalari;</li><li>tog‘ echkisi;</li><li>kiyik;</li><li>yovvoyi ot;</li><li>qoplon;</li><li>quyon;</li><li>mayda kemiruvchilar;</li><li>qushlarning suyaklari topilgan.</li></ul>\n<p>Neandertal bola</p>\n<p>Teshiktosh g‘oridan 8–9 yashar neandertal bolaning suyak qoldiqlari topilgan.</p>\n<p>Bola:</p>\n<ul><li>qabrga ko‘milgan;</li><li>jasadi atrofiga tog‘ echkisi shoxlari qadab chiqilgan.</li></ul>\n<blockquote>Test uchun “Teshiktosh”ni ko‘rsangiz: Boysun → o‘rta paleolit → 100–40 mingyillik → 8–9 yashar neandertal → tog‘ echkisi shoxlari.</blockquote>\n<h2>7. ODAMLARNING GURUH BO‘LIB YASHASHI</h2>\n<p>Qadimgi odamlar yirtqich hayvonlar xavfiga duch kelgan.</p>\n<p>Mavzuda g‘or sheriga qarshi odamlarning guruh bo‘lib harakat qilgani tasvirlangan.</p>\n<p>Odamlar:</p>\n<ul><li>bir-biridan ajralib ketmasdan;</li><li>yelkama-yelka turib;</li><li>birgalikda qarshilik ko‘rsatgan.</li></ul>\n<p>Natijada odamlar guruh-guruh bo‘lib yuradigan bo‘lganlar.</p>\n<p>Muhim xulosa</p>\n<p>Guruh bo‘lib harakat qilish → xavfga qarshi kurashishda yordam bergan.</p>\n<h2>8. DINIY E’TIQODLARNING VUJUDGA KELISHI</h2>\n<p>Qadimgi odamlar atrofdagi ko‘plab hodisalarni tushuntira olmagan.</p>\n<p>Masalan:</p>\n<ul><li>kun va tunning almashinishi;</li><li>yil fasllarining almashinishi;</li><li>vulqon otilishi;</li><li>zilzila;</li><li>momaqaldiroq;</li><li>yashin;</li><li>shamol;</li><li>yomg‘ir.</li></ul>\n<p>Ular tabiatni jonli deb hisoblashgan.</p>\n<p>Shu asosda tevarak-atrofda ezgu va yovuz kuchlar borligiga ishonch paydo bo‘lgan.</p>\n<h2>9. QADIMGI DINIY E’TIQODLAR</h2>\n<p><b>TOTEMIZM</b></p>\n<p>Odamlar guruhi jamoasining biror hayvon yoki o‘simlik turi bilan qarindoshlik aloqasiga ishonishi.</p>\n<p>Eslab qolish:</p>\n<p>Totemizm → qarindoshlik → hayvon yoki o‘simlik</p>\n<p><b>ANIMIZM</b></p>\n<p>Odamni o‘rab turgan muhitdagi har bir narsaning joni va ruhi borligiga ishonish.</p>\n<p>Eslab qolish:</p>\n<p>Animizm → jon + ruh</p>\n<p><b>FETISHIZM</b></p>\n<p>U yoki bu buyumlar omad keltirishiga yoxud balo-qazoni daf qilishiga ishonish.</p>\n<p>Eslab qolish:</p>\n<p>Fetishizm → buyum → omad yoki balo-qazoni daf qilish</p>\n<p>Uchalasini bir-biridan ajratish</p>\n<table><tr><th>E’tiqod</th><th>Asosiy belgisi</th></tr><tr><td>Totemizm</td><td>hayvon yoki o‘simlik bilan qarindoshlik</td></tr><tr><td>Animizm</td><td>har bir narsaning joni va ruhi borligi</td></tr><tr><td>Fetishizm</td><td>buyum omad keltirishi yoki baloni daf qilishi</td></tr></table>\n<blockquote>Eng qisqa yodlash usuli: TOTEM → qarindosh ANIM → jon-ruh FETISH → buyum</blockquote>\n<h2>10. SO‘NGGI PALEOLIT VA QOYA RASMLARI</h2>\n<p>So‘nggi paleolitga oid g‘orlar devorlaridagi rasmlar qadimgi odamlarda diniy e’tiqodlar bo‘lganining isbotidir.</p>\n<p>Eng qadimiy rasmlar topilgan mashhur g‘orlar:</p>\n<table><tr><th>Davlat/hudud</th><th>G‘or</th></tr><tr><td>Ispaniya</td><td>Altamira</td></tr><tr><td>Fransiya</td><td>Lasko</td></tr><tr><td>Boshqirdiston (Rossiya)</td><td>Kapova</td></tr></table>\n<p>Yodlash formulasi:</p>\n<p>Ispaniya → Altamira<br>Fransiya → Lasko<br>Boshqirdiston → Kapova</p>\n<h2>11. QOYA RASMLARINING MAQSADI</h2>\n<p>Qadimgi odamlar bu rasmlar bo‘lajak ovda ularga yordam beradi, deb ishongan.</p>\n<p>Rasmlar qarshisida ular:</p>\n<ul><li>hayvonlar harakatlariga taqlid qilib raqsga tushgan;</li><li>ov manzaralarini tasavvur qilgan;</li><li>nayza uloqtirishni mashq qilgan.</li></ul>\n<p>Demak, qoyatosh rasmlari faqat bezak emas, balki qadimgi odamlarning diniy tasavvurlari va ov bilan bog‘liq qarashlarini ham aks ettirgan.</p>\n<h2>12. ENG QADIMGI TASVIRIY SAN’AT</h2>\n<p>Qadimgi rasmlar orqali:</p>\n<ul><li>inson nimalar haqida o‘ylaganini;</li><li>tevarak dunyoni qanday tasavvur qilganini;</li><li>qaysi hayvonlarni ovlaganini;</li><li>qanday mehnat qurollari va qurol-yarog‘lardan foydalanganini</li></ul>\n<p>bilish mumkin.</p>\n<p>Tasviriy san’atning rivojlanishiga asos</p>\n<p>Odamning o‘zini qurshab turgan tevarak-dunyoni bilishga intilishi eng qadimgi tasviriy san’at rivojlanishiga asos bo‘lgan.</p>\n<h2>13. ALTAMIRA G‘ORI</h2>\n<p>Dastlabki qoya tasvirlarini arxeologning qizalog‘i kashf qilgan.</p>\n<p>Voqea Ispaniyaning Altamira g‘orida sodir bo‘lgan.</p>\n<p>Arxeolog mehnat qurollarini to‘playotgan paytda qizaloq g‘orni kezib yurib, shiftga qarashni aytgan. Chiroq nuri tushirilgach, qadimgi rasmlar ko‘ringan.</p>\n<p>Altamira rasmlarida:</p>\n<ul><li>yovvoyi buqa;</li><li>to‘ng‘iz;</li><li>bug‘ular</li></ul>\n<p>tasvirlangan.</p>\n<p>Rasmlar qirmizi va boshqa ranglar bilan ishlangan.</p>\n<p>Muhim bog‘lanish:</p>\n<p>Arxeologning qizalog‘i → Altamira → Ispaniya → yovvoyi buqa, to‘ng‘iz, bug‘u.</p>\n<h2>14. PETROGLIF</h2>\n<p>Tarix fanida ibtidoiy odamlar tomonidan toshga o‘yib ishlangan tasvirlar:</p>\n<p>PETROGLIF deb ataladi.</p>\n<p>Testda farqlash:</p>\n<p>Petroglif → toshga o‘yilgan tasvir.</p>\n<h2>15. TEST UCHUN ENG MUHIM “MANZIL → MA’LUMOT”LAR</h2>\n<table><tr><th>Manzil</th><th>Eslab qolish kerak bo‘lgan ma’lumot</th></tr><tr><td>Sharqiy Afrika</td><td>eng qadimgi odam suyaklari, 2 mln yildan ortiq</td></tr><tr><td>Selungur</td><td>Farg‘ona vodiysi, qadimiy tosh qurollari</td></tr><tr><td>Ko‘lbuloq</td><td>Toshkent viloyati, qadimiy tosh qurollari</td></tr><tr><td>Teshiktosh</td><td>Boysun tog‘lari, o‘rta paleolit</td></tr><tr><td>Altamira</td><td>Ispaniya, qoya rasmlari</td></tr><tr><td>Lasko</td><td>Fransiya, qoya rasmlari</td></tr><tr><td>Kapova</td><td>Boshqirdiston (Rossiya), qoya rasmlari</td></tr></table>\n<h2>16. TEST UCHUN ENG MUHIM “DAVR → BELGI”LAR</h2>\n<table><tr><th>Davr</th><th>Asosiy ma’lumot</th></tr><tr><td>Ilk paleolit oxiri</td><td>Buyuk muzlik davri boshlandi</td></tr><tr><td>O‘rta paleolit</td><td>mil. avv. 100–40-mingyilliklar</td></tr><tr><td>So‘nggi paleolit</td><td>eng qadimiy g‘or/qoya rasmlari bilan bog‘liq</td></tr></table>\n<h2>17. TESTDA CHALKASHTIRILADIGAN JUFTLIKLAR</h2>\n<p>1. Ishbilarmon odam ↔ Tik yuruvchi odam</p>\n<p>Ishbilarmon odam:</p>\n<ul><li>Sharqiy Afrikadan topilgan;</li><li>yoshi 2 mln yildan oshadi;</li><li>toshdan o‘ta sodda mehnat qurollari yasagan.</li></ul>\n<p>Tik yuruvchi odam:</p>\n<ul><li>tanasi ancha baquvvat;</li><li>turli tosh qurollar yasagan;</li><li>tabiiy olovdan foydalangan;</li><li>Afrika, Yevropa va Osiyoga tarqalgan.</li></ul>\n<p>2. Tabiiy olov ↔ Sun’iy olov</p>\n<p>Berilgan mavzuda:</p>\n<p>Tik yuruvchi odam → tabiiy olovdan foydalanishni bilgan.</p>\n<p>3. Chopper</p>\n<p>Bir tomoni urib o‘tkirlangan qo‘pol tosh qurol → chopper.</p>\n<p>4. O‘zlashtiruvchi xo‘jalik</p>\n<p>Meva-ildiz terish + ov qilish → o‘zlashtiruvchi xo‘jalik.</p>\n<p>5. Diniy e’tiqodlar</p>\n<p>Totemizm → qarindoshlik<br>Animizm → jon va ruh<br>Fetishizm → buyum va omad</p>\n<p>6. G‘orlar</p>\n<p>Altamira → Ispaniya<br>Lasko → Fransiya<br>Kapova → Boshqirdiston (Rossiya)</p>\n<h2>18. 2-§ BO‘YICHA YODLASH UCHUN YAGONA SXEMA</h2>\n<p><b>ENG QADIMGI ODAMLAR</b></p>\n<p class=\"ar\">↓</p>\n<p>“Ishbilarmon odam”<br>→ Sharqiy Afrika<br>→ 2 mln yildan ortiq<br>→ sodda tosh qurollar</p>\n<p class=\"ar\">↓</p>\n<p>“Tik yuruvchi odam”<br>→ baquvvat<br>→ turli tosh qurollar<br>→ tabiiy olov<br>→ Afrika + Yevropa + Osiyo</p>\n<p class=\"ar\">↓</p>\n<p>Buyuk muzlik davri<br>→ ilk paleolit oxiri<br>→ sovuq kuchaydi<br>→ odamlar issiq va pana joylarni izladilar</p>\n<p class=\"ar\">↓</p>\n<p>Eng qadimiy mashg‘ulotlar<br>→ meva-ildiz terish + ov<br>→ o‘zlashtiruvchi xo‘jalik</p>\n<p class=\"ar\">↓</p>\n<p>Selungur → Farg‘ona vodiysi<br>Ko‘lbuloq → Toshkent viloyati<br>→ chopperlar</p>\n<p class=\"ar\">↓</p>\n<p>Teshiktosh<br>→ Boysun<br>→ o‘rta paleolit<br>→ mil. avv. 100–40 mingyillik<br>→ 8–9 yashar neandertal bola<br>→ tog‘ echkisi shoxlari</p>\n<p class=\"ar\">↓</p>\n<p>Diniy e’tiqodlar<br>→ totemizm<br>→ animizm<br>→ fetishizm</p>\n<p class=\"ar\">↓</p>\n<p>So‘nggi paleolit<br>→ g‘or rasmlari<br>→ Altamira<br>→ Lasko<br>→ Kapova</p>\n<p class=\"ar\">↓</p>\n<p>Tasviriy san’at<br>→ tevarak dunyoni bilishga intilish</p>\n<p class=\"ar\">↓</p>\n<p>Petroglif<br>→ toshga o‘yilgan tasvir</p>\n<h2>19. 53 TA TESTNI YECHISH UCHUN “OLTIN QOIDALAR”</h2>\n<p>1. Sharqiy Afrika ko‘rinsa — eng qadimgi odam va 2 mln yildan ortiq ma’lumotini eslang.<br>2. Ishbilarmon odam — sodda tosh qurollar.<br>3. Tik yuruvchi odam — baquvvat tana + turli tosh qurollar + tabiiy olov.<br>4. Afrika + Yevropa + Osiyo — tik yuruvchi odamlarning tarqalish hududi.<br>5. Ilk paleolit oxiri — Buyuk muzlik davri boshlanishi.<br>6. Selungur — Farg‘ona vodiysi.<br>7. Ko‘lbuloq — Toshkent viloyati.<br>8. Bir tomoni o‘tkirlangan qo‘pol tosh — chopper.<br>9. Meva-ildiz terish + ov — o‘zlashtiruvchi xo‘jalik.<br>10. Teshiktosh — Boysun tog‘lari.<br>11. 100–40 mingyillik — o‘rta paleolit.<br>12. 8–9 yashar neandertal — Teshiktosh.<br>13. Tog‘ echkisi shoxlari — Teshiktoshdagi bola jasadi atrofi.<br>14. Totemizm — hayvon/o‘simlik bilan qarindoshlik.<br>15. Animizm — joni va ruhi borligiga ishonish.<br>16. Fetishizm — buyum omad keltirishi yoki baloni daf qilishi.<br>17. So‘nggi paleolit — qadimiy g‘or rasmlari.<br>18. Altamira — Ispaniya.<br>19. Lasko — Fransiya.<br>20. Kapova — Boshqirdiston (Rossiya).<br>21. Yovvoyi buqa + to‘ng‘iz + bug‘u — Altamira.<br>22. Arxeologning qizalog‘i — Altamira rasmlarini kashf qilgan.<br>23. Petroglif — toshga o‘yilgan tasvir.<br>24. Tasviriy san’atning asosi — tevarak dunyoni bilishga intilish.</p>\n<p>Eng muhim yodlash formulasi:</p>\n<p><b>ISHBILARMON → SODDA TOSH QUROL</b></p>\n<p><b>TIK YURUVCHI → TABIIY OLOV</b></p>\n<p><b>SELUNGUR → FARG‘ONA</b></p>\n<p><b>KO‘LBULOQ → TOSHKENT</b></p>\n<p><b>TESHIKTOSH → BOYSUN → NEANDERTAL</b></p>\n<p><b>TOTEM → QARINDOSHLIK</b></p>\n<p><b>ANIM → JON-RUH</b></p>\n<p><b>FETISH → BUYUM</b></p>\n<p><b>ALTAMIRA → window.CONTENT.topics.push({id:3,title:"3-§. Urug‘chilik jamiyati",guide:"<h2>1. DAVRLAR XRONOLOGIYASI</h2>\n<p>Bu mavzudagi testlarning eng katta qismi davrlarni bir-biridan ajratishga asoslangan.</p>\n<table><tr><th>Davr</th><th>Vaqti</th><th>Eng muhim belgilar</th></tr><tr><td>O‘rta paleolit</td><td>mil. avv. 100–40-mingyilliklar</td><td>Neandertal, Teshiktosh</td></tr><tr><td>So‘nggi paleolit</td><td>mil. avv. 40–12-mingyilliklar</td><td>Kromanyon, urug‘ jamoasi, boshpana, taqinchoqlar</td></tr><tr><td>Mezolit</td><td>mil. avv. 12–7-mingyilliklar</td><td>o‘q-yoy, hayvonlarni qo‘lga o‘rgatish, ibtidoiy ziroatchilik va chorvachilik</td></tr><tr><td>Neolit</td><td>mil. avv. 6–4-mingyilliklar</td><td>ishlab chiqaruvchi xo‘jalik, sopol idish, kulolchilik, to‘quvchilik</td></tr></table>\n<p>Eng muhim raqamli zanjir:</p>\n<p><b>100–40 → O‘RTA PALEOLIT</b></p>\n<p><b>40–12 → SO‘NGGI PALEOLIT</b></p>\n<p><b>12–7 → MEZOLIT</b></p>\n<p><b>6–4 → NEOLIT</b></p>\n<h2>2. SO‘NGGI PALEOLIT</h2>\n<p>So‘nggi paleolit davri:</p>\n<p>mil. avv. 40–12-mingyilliklar.</p>\n<p>Bu davrda:</p>\n<ul><li>toshga ishlov berish texnikasi o‘zgardi;</li><li>mehnat qurollari yasash usullari rivojlandi;</li><li>odamning aqliy qobiliyati o‘zgardi;</li><li>odamning tashqi qiyofasi ham o‘zgarib bordi;</li><li>zamonaviy qiyofaga ega kromanyon odami yashagan.</li></ul>\n<p>Kromanyonni eslab qoling:</p>\n<p>Kromanyon → zamonaviy qiyofa → so‘nggi paleolit.</p>\n<h2>3. SO‘NGGI PALEOLIT MANZILGOHLARI</h2>\n<p>O‘zbekistondagi so‘nggi paleolitga oid manzilgohlar:</p>\n<ul><li>Samarqand shahri hududi;</li><li>Toshkent viloyati — Ko‘lbuloq;</li><li>Farg‘ona vodiysi.</li></ul>\n<p>Test formulasi:</p>\n<p>Samarqand + Ko‘lbuloq/Toshkent + Farg‘ona → so‘nggi paleolit.</p>\n<h2>4. URUG‘ JAMOASI VA QABILA</h2>\n<p>So‘nggi paleolitda odamlar rivojlanishida muhim o‘zgarish yuz berdi.</p>\n<p>Odamlar qarindoshlardan tarkib topgan ixcham guruhlarga — urug‘ jamoalariga birlashdilar.</p>\n<p>Urug‘ jamoasi</p>\n<p>Qarindoshlardan tarkib topgan ixcham guruh → urug‘ jamoasi.</p>\n<p>Urug‘ a’zolari bitta manzilgohda yashagan.</p>\n<p>Bir joyda yashagan bir qancha urug‘lar → qabilani tashkil etgan.</p>\n<p>Eng muhim zanjir:</p>\n<p>qarindoshlar → urug‘</p>\n<p>bir qancha urug‘ → qabila</p>\n<p>Shuning uchun testda:</p>\n<blockquote>“Bir joyda yashab turgan bir qancha urug‘lar nima tashkil etgan?”</blockquote>\n<p>degan savolga javob qabila bo‘ladi.</p>\n<h2>5. SO‘NGGI PALEOLITNING MUHIM YUTUQLARI</h2>\n<p>So‘nggi paleolit odam:</p>\n<ul><li>olov hosil qilishni;</li><li>taqinchoqlar yasashni;</li><li>boshpana qurishni;</li><li>kesuvchi va arralovchi mehnat qurollari yasashni</li></ul>\n<p>o‘rgandi.</p>\n<p>Taqinchoqlar:</p>\n<ul><li>munchoq;</li><li>tumor;</li><li>uzuk.</li></ul>\n<p>Kiyim</p>\n<p>So‘nggi paleolit odamlari kiyim-kechakni hayvonlar terisidan tayyorlagan.</p>\n<p>Juda muhim farq:</p>\n<p>So‘nggi paleolit → hayvon terisidan kiyim</p>\n<p>Neolit → tolalar va jundan kiyim-kechak, to‘quvchilik</p>\n<h2>6. SO‘NGGI PALEOLITNI MEZOLIT BILAN ADASHTIRMANG</h2>\n<p>So‘nggi paleolit:</p>\n<ul><li>kromanyon;</li><li>urug‘ jamoalari;</li><li>qabila;</li><li>boshpana;</li><li>olov hosil qilish;</li><li>taqinchoqlar;</li><li>kesuvchi va arralovchi qurollar;</li><li>hayvon terisidan kiyim.</li></ul>\n<p>Mezolit:</p>\n<ul><li>o‘q-yoy;</li><li>hayvonlarni qo‘lga o‘rgatish;</li><li>ibtidoiy ziroatchilik;</li><li>ibtidoiy chorvachilik;</li><li>itning qo‘lga o‘rgatilishi.</li></ul>\n<h2>7. MEZOLIT</h2>\n<p>Mezolit — o‘rta tosh davri.</p>\n<p>Vaqti:</p>\n<p>mil. avv. 12–7-mingyilliklar.</p>\n<p>Mezolit boshlanishi bilan:</p>\n<p>muzlik davri poyoniga yetdi → iqlim ancha ilidi → odamlar turmushida o‘zgarishlar yuz berdi.</p>\n<p>Asosiy belgilar:</p>\n<ul><li>o‘q-yoy yasash;</li><li>hayvonlarni qo‘lga o‘rgata boshlash;</li><li>ibtidoiy ziroatchilik;</li><li>ibtidoiy chorvachilik.</li></ul>\n<h2>8. MEZOLIT MANZILGOHLARI</h2>\n<p>O‘rta Osiyodagi mezolit manzilgohlari:</p>\n<table><tr><th>Manzilgoh</th><th>Hudud</th></tr><tr><td>Obishir</td><td>Farg‘ona vodiysi</td></tr><tr><td>Qo‘shilish</td><td>Toshkent vohasi</td></tr><tr><td>Machay</td><td>Surxondaryo viloyati</td></tr></table>\n<p>Yodlash:</p>\n<p><b>OBISHIR → FARG‘ONA</b></p>\n<p><b>QO‘SHILISH → TOSHKENT</b></p>\n<p><b>MACHAY → SURXONDARYO</b></p>\n<p>Bu uchlikni albatta yodlab olish kerak.</p>\n<h2>9. BUYUK MUZLIK DAVRI</h2>\n<p>Mavzudagi muhim ketma-ketlik:</p>\n<p>Ilk paleolit oxiri → Buyuk muzlik davri boshlandi.</p>\n<p>Keyinchalik:</p>\n<p>Mezolit boshlandi → muzlik davri poyoniga yetdi → iqlim ilidi.</p>\n<p>Shuning uchun testlarda:</p>\n<ul><li>“Buyuk muzlik davri qachon boshlandi?” → ilk paleolit oxiri.</li><li>“Qachon poyoniga yetdi?” → mezolit boshlanishida.</li></ul>\n<h2>10. ITNING QO‘LGA O‘RGATILISHI</h2>\n<p>Insoniyat tomonidan dastlab qo‘lga o‘rgatilgan hayvon:</p>\n<p>IT.</p>\n<p>Mavzuda itning odamlar yashaydigan g‘or tomon kelishiga ochlik sabab bo‘lgani aytiladi.</p>\n<p>It keyinchalik:</p>\n<ul><li>odamlar bilan yashashga o‘rgandi;</li><li>xavf paytida odamlarni ogohlantirdi;</li><li>odamlarning doimiy hamrohiga aylandi.</li></ul>\n<p>Test uchun:</p>\n<p>Birinchi qo‘lga o‘rgatilgan hayvon → it.</p>\n<h2>11. MEZOLIT DAVRINING ASOSIY UCHLIGI</h2>\n<p>Mezolitni testda tez aniqlash uchun:</p>\n<p><b>1. O‘Q-YOY</b></p>\n<p>Mezolit → o‘q-yoy</p>\n<p><b>2. HAYVONLARNI QO‘LGA O‘RGATISH</b></p>\n<p>Mezolit → hayvonlarni qo‘lga o‘rgata boshlash</p>\n<p><b>3. IBTIDOIY ZIROATCHILIK VA CHORVACHILIK</b></p>\n<p>Mezolit → ibtidoiy ziroatchilik va chorvachilik</p>\n<p>Shu uchta belgidan bittasi berilsa ham, mezolitni eslang.</p>\n<h2>12. O‘ZLASHTIRUVCHI VA ISHLAB CHIQARUVCHI XO‘JALIK</h2>\n<p>Bu mavzuning eng muhim tushunchalaridan biri.</p>\n<p>O‘zlashtiruvchi xo‘jalik</p>\n<p>Tabiatda mavjud narsalarni o‘zlashtirishga asoslangan.</p>\n<p>Unga:</p>\n<ul><li>terimchilik;</li><li>ovchilik;</li><li>baliqchilik</li></ul>\n<p>kiradi.</p>\n<p>Formula:</p>\n<p><b>TERIM + OV + BALIQ → O‘ZLASHTIRUVCHI XO‘JALIK</b></p>\n<p>Ishlab chiqaruvchi xo‘jalik</p>\n<p>Odamning o‘zi mahsulot yetishtirishiga asoslangan.</p>\n<p>Unga:</p>\n<ul><li>dehqonchilik;</li><li>chorvachilik</li></ul>\n<p>kiradi.</p>\n<p>Formula:</p>\n<p><b>DEHQONCHILIK + CHORVACHILIK → ISHLAB CHIQARUVCHI XO‘JALIK</b></p>\n<h2>13. NEOLIT</h2>\n<p>Neolit — yangi tosh davri.</p>\n<p>O‘rta Osiyoda:</p>\n<p>mil. avv. 6–4-mingyilliklar.</p>\n<p>Neolit davrida odamlar qadimgi Sharqning turli hududlarida ishlab chiqaruvchi xo‘jalikka o‘ta boshladilar:</p>\n<p>ziroatchilik + chorvachilik.</p>\n<p>Testda:</p>\n<blockquote>“Ishlab chiqaruvchi xo‘jalik” deyilsa — dehqonchilik va chorvachilikni eslang.</blockquote>\n<h2>14. NEOLITNING ENG MUHIM BELGISI</h2>\n<p>Arxeologlar neolit davri boshlanishini:</p>\n<p>sopol idishlar yasashning kashf etilishi bilan</p>\n<p>belgilaydilar.</p>\n<p>Shuning uchun:</p>\n<p>Neolit → sopol idish → kulolchilik.</p>\n<h2>15. MIKROLITLAR</h2>\n<p>Mezolit va neolit davrida odam:</p>\n<p>toshdan mayda mehnat qurollari — mikrolitlar yasagan.</p>\n<p>Demak:</p>\n<p>Mezolit + Neolit → mikrolitlar.</p>\n<p>Bu ma’lumotni faqat neolitga bog‘lab qo‘ymaslik kerak.</p>\n<h2>16. TOSHGA ISHLOV BERISH</h2>\n<p>Mezolit va neolitda toshga ishlov berish rivojlandi.</p>\n<p>Neolitda odamlar:</p>\n<ul><li>silliqlash;</li><li>teshikchalar parmalash</li></ul>\n<p>usullarini qo‘llay boshlagan.</p>\n<p>Test formulasi:</p>\n<p>Silliqlash + teshikchalar parmalash → neolit.</p>\n<h2>17. KULOLCHILIK</h2>\n<p>Loydan ishlangan va olovda pishirilgan idishlar yasash → kulolchilik.</p>\n<p>Bu neolit davrining muhim kashfiyotlaridan.</p>\n<p>Eslab qoling:</p>\n<p>Neolit → sopol idish → kulolchilik.</p>\n<h2>18. TO‘QUVCHILIK</h2>\n<p>Neolit davrining yana bir muhim kashfiyoti:</p>\n<p>tolalar va jundan kiyim-kechak tayyorlash → to‘quvchilik.</p>\n<p>Shuning uchun:</p>\n<p>Hayvon terisi → so‘nggi paleolit</p>\n<p>Tolalar va jun → neolit</p>\n<p>Bu ikki ma’lumotni testlarda adashtirmaslik kerak.</p>\n<h2>19. DAVRLAR BO‘YICHA ENG MUHIM BELGILAR</h2>\n<p><b>SO‘NGGI PALEOLIT</b></p>\n<p>40–12 mingyillik</p>\n<ul><li>Kromanyon</li><li>urug‘ jamoasi</li><li>qabila</li><li>boshpana</li><li>olov hosil qilish</li><li>taqinchoqlar</li><li>kesuvchi va arralovchi qurollar</li><li>hayvon terisidan kiyim</li></ul>\n<p><b>MEZOLIT</b></p>\n<p>12–7 mingyillik</p>\n<ul><li>o‘q-yoy</li><li>hayvonlarni qo‘lga o‘rgatish</li><li>it</li><li>ibtidoiy ziroatchilik</li><li>ibtidoiy chorvachilik</li><li>muzlik davrining poyoni</li></ul>\n<p><b>NEOLIT</b></p>\n<p>6–4 mingyillik</p>\n<ul><li>ishlab chiqaruvchi xo‘jalik</li><li>dehqonchilik</li><li>chorvachilik</li><li>sopol idish</li><li>kulolchilik</li><li>to‘quvchilik</li><li>tolalar va jun</li><li>silliqlash</li><li>teshikchalar parmalash</li><li>mikrolitlar</li></ul>\n<h2>20. MANZILGOHLARNI BIR QATORDA YODLANG</h2>\n<p>So‘nggi paleolit:</p>\n<p>Samarqand — Ko‘lbuloq — Farg‘ona</p>\n<p>Mezolit:</p>\n<p>Obishir — Farg‘ona</p>\n<p>Qo‘shilish — Toshkent</p>\n<p>Machay — Surxondaryo</p>\n<p>Alohida muhim manzil:</p>\n<p>Teshiktosh → o‘rta paleolit</p>\n<p>Shu sababli Teshiktoshni mezolit yoki so‘nggi paleolit bilan aralashtirmang.</p>\n<h2>21. TESTDA ENG KO‘P CHALKASHADIGAN MA’LUMOTLAR</h2>\n<p>1. O‘rta paleolit</p>\n<p>100–40 mingyillik</p>\n<p>2. So‘nggi paleolit</p>\n<p>40–12 mingyillik</p>\n<p>3. Mezolit</p>\n<p>12–7 mingyillik</p>\n<p>4. Neolit</p>\n<p>6–4 mingyillik</p>\n<p>5. Kromanyon</p>\n<p>So‘nggi paleolit</p>\n<p>6. Neandertal</p>\n<p>O‘rta paleolit / Teshiktosh</p>\n<p>7. O‘q-yoy</p>\n<p>Mezolit</p>\n<p>8. Sopol idish</p>\n<p>Neolit</p>\n<p>9. Hayvon terisidan kiyim</p>\n<p>So‘nggi paleolit</p>\n<p>10. Tolalar va jundan kiyim</p>\n<p>Neolit</p>\n<p>11. Tabiiy olovdan foydalanish</p>\n<p>Oldingi 2-§ mavzu — tik yuruvchi odam</p>\n<p>12. Olov hosil qilish</p>\n<p>So‘nggi paleolit</p>\n<p>Bu ikki ma’lumotni alohida ajrating.</p>\n<h2>22. 3-§ NI 1 DAQIQADA TAKRORLASH</h2>\n<p><b>40–12 → SO‘NGGI PALEOLIT</b></p>\n<p>Kromanyon</p>\n<p>Urug‘ → qabila</p>\n<p>Boshpana</p>\n<p>Olov hosil qilish</p>\n<p>Taqinchoq</p>\n<p class=\"ar\">↓</p>\n<p><b>12–7 → MEZOLIT</b></p>\n<p>O‘q-yoy</p>\n<p>It</p>\n<p>Hayvonlarni qo‘lga o‘rgatish</p>\n<p>Ibtidoiy ziroatchilik + chorvachilik</p>\n<p class=\"ar\">↓</p>\n<p><b>6–4 → NEOLIT</b></p>\n<p>Ishlab chiqaruvchi xo‘jalik</p>\n<p>Dehqonchilik + chorvachilik</p>\n<p>Sopol idish</p>\n<p>Kulolchilik</p>\n<p>To‘quvchilik</p>\n<p>Silliqlash + teshik parmalash</p>\n<p>Mikrolit</p>\n<h2>23. 10/10 UCHUN “OLTIN FORMULA”</h2>\n<p><b>DAVR:</b></p>\n<p><b>100–40 → O‘RTA PALEOLIT</b></p>\n<p><b>40–12 → SO‘NGGI PALEOLIT</b></p>\n<p><b>12–7 → MEZOLIT</b></p>\n<p><b>6–4 → NEOLIT</b></p>\n<p><b>ODAM:</b></p>\n<p>Kromanyon → so‘nggi paleolit</p>\n<p><b>JAMOA:</b></p>\n<p>Qarindoshlar → urug‘</p>\n<p>Bir qancha urug‘ → qabila</p>\n<p><b>MEZOLIT:</b></p>\n<p><b>O‘Q-YOY + IT + HAYVONLARNI QO‘LGA O‘RGATISH</b></p>\n<p><b>XO‘JALIK:</b></p>\n<p>Terim + ov + baliq → o‘zlashtiruvchi</p>\n<p>Dehqonchilik + chorvachilik → ishlab chiqaruvchi</p>\n<p><b>NEOLIT:</b></p>\n<p><b>SOPOL + KULOLCHILIK + TO‘QUVCHILIK + SILLIQLASH + TEShIK PARMALASH</b></p>\n<p>Yakuniy xotira xaritasi</p>\n<p><b>SO‘NGGI PALEOLIT</b></p>\n<p>40–12 mingyillik</p>\n<p class=\"ar\">↓</p>\n<p>Kromanyon</p>\n<p class=\"ar\">↓</p>\n<p>Urug‘ jamoasi</p>\n<p class=\"ar\">↓</p>\n<p>Qabila</p>\n<p class=\"ar\">↓</p>\n<p>Boshpana + olov + taqinchoq + teri kiyim</p>\n<p class=\"ar\">↓</p>\n<p><b>MEZOLIT</b></p>\n<p>12–7 mingyillik</p>\n<p class=\"ar\">↓</p>\n<p>O‘q-yoy</p>\n<p class=\"ar\">↓</p>\n<p>It va boshqa hayvonlarni qo‘lga o‘rgatish</p>\n<p class=\"ar\">↓</p>\n<p>Ibtidoiy ziroatchilik + chorvachilik</p>\n<p class=\"ar\">↓</p>\n<p><b>NEOLIT</b></p>\n<p>6–4 mingyillik</p>\n<p class=\"ar\">↓</p>\n<p>Ishlab chiqaruvchi xo‘jalik</p>\n<p class=\"ar\">↓</p>\n<p>Dehqonchilik + chorvachilik</p>\n<p class=\"ar\">↓</p>\n<p>Sopol idish + kulolchilik</p>\n<p class=\"ar\">↓</p>\n<p>Tolalar + jun + to‘quvchilik</p>\n<p class=\"ar\">↓</p>\n<p>Silliqlash + teshikchalar parmalash</p>\n<p>Qoʻllanma muallifi.      O. RAXMONOV</p>",questions:Q3});

function say(t){if(!SND)return false;try{const ss=window.speechSynthesis;if(!ss||typeof SpeechSynthesisUtterance=='undefined')return false;ss.cancel();const u=new SpeechSynthesisUtterance(nrm(t));u.lang='uz-UZ';const v=(ss.getVoices()||[]).find(x=>/^uz/i.test(x.lang));if(v)u.voice=v;u.rate=.95;ss.speak(u);return true}catch(e){return false}}
function stopSay(){try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function vOn(){return !!SR&&(S.vc===undefined?true:S.vc)}
function stopRec(){try{if(S.rec){S.rec.onresult=S.rec.onerror=S.rec.onend=null;S.rec.abort()}}catch(e){}S.rec=null;const m=$('mic');if(m)m.classList.remove('on')}
function vstat(t){const e=$('vs');if(e)e.textContent=t}
function micUI(q){return S.timed&&vOn()&&(S.typed||q.type=='fill'||q.type=='tf')?'<button class="b g" id="mic" onclick="startRec()">🎤 Javobni aytish</button><div id="vs" class="tag"></div>':''}
function startRec(){if(!SR||S.done)return;stopRec();const q=S.q[S.i];let r;try{r=new SR()}catch(e){return}
 S.rec=r;r.lang='uz-UZ';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
 r.onstart=()=>{vstat('🎤 Tinglayapman… javobni ayting');const m=$('mic');if(m)m.classList.add('on')};
 r.onresult=ev=>{const res=ev.results[ev.results.length-1];const alts=[];for(let i=0;i<res.length;i++)alts.push(String(res[i].transcript).trim());S.rec=null;applyVoice(q,alts)};
 r.onerror=ev=>{S.rec=null;const e=ev.error;vstat(e=='not-allowed'||e=='service-not-allowed'?'⚠ Mikrofon ishlamayapti: ruxsat berilmagan yoki fayl shu usulda ochilgan. Javobni yozing.':e=='no-speech'?'Ovoz eshitilmadi. 🎤 ni bosing.':e=='network'?'⚠ Internet kerak.':e=='language-not-supported'?'⚠ Bu qurilmada o‘zbekcha ovozni tanish yo‘q. Javobni yozing.':'Ovozni tanib bo‘lmadi. 🎤 ni bosing.');const m=$('mic');if(m)m.classList.remove('on')};
 r.onend=()=>{const m=$('mic');if(m)m.classList.remove('on')};
 try{r.start()}catch(e){vstat('Mikrofonni ishga tushirib bo‘lmadi.')}}
function applyVoice(q,alts){if(S.done)return;S.alts=alts;
 if(q.type=='tf'){const t=nrm(alts[0]).toLowerCase().replace(/[\s']/g,'');const neg=/notog?ri|xato|yolg|yoq/.test(t);const pos=/tog?ri|rost|^ha/.test(t);if(!neg&&!pos){vstat('Tushunmadim: «'+alts[0]+'». «To‘g‘ri» yoki «noto‘g‘ri» deng.');return}tfa(!neg);return check()}
 const el=$('tx')||$('f');if(!el)return;el.value=alts[0];S.vtxt=alts[0];check()}
function toggleSnd(){SND=!SND;try{localStorage.setItem('snd',SND?'1':'0')}catch(e){}$('snd').textContent=SND?'🔊':'🔇';if(!SND){stopSay();return}
 const ok=say("Ovoz yoqildi. Javoblar ovoz chiqarib aytiladi.");if(!ok){alert("Bu qurilmada ovozli o‘qish topilmadi.");return}
 try{const vs=window.speechSynthesis.getVoices()||[];if(vs.length&&!vs.some(x=>/^uz/i.test(x.lang)))alert("Telefonda o‘zbekcha ovoz topilmadi: so‘zlar noto‘g‘ri o‘qilishi mumkin. Sozlamalar → Til → Matnni ovozga aylantirish bo‘limida o‘zbek tilini yuklang.")}catch(e){}}
function sayQ(q){}
function sayA(ok,to,ans){if(!SND)return;say(ok?"To'g'ri!":(to?"Vaqt tugadi. ":"Noto'g'ri. ")+"To'g'ri javob: "+ans)}
function head(t,back){stopSay();stopRec();$('ttl').textContent=t;$('back').hidden=!back}
function go(){clearInterval(S.iv);S={};home()}
function home(){head("6-sinf Tarix",0);app.innerHTML=`<div class="card"><h2>📜 Tarix – 6-sinf</h2><p>Mavzu qo‘llanmasi va testlar.</p></div>
<button class="b" onclick="guideList()">📖 Mavzu qo‘llanmasi</button><button class="b" onclick="testMenu()">📝 Testlar</button>`}
function guideList(){head("Mavzu qo‘llanmasi",1);app.innerHTML=T.map((t,i)=>`<button class="opt" onclick="guide(${i})">${i+1}. ${E(t.title)}</button>`).join('')}
function guide(i){const t=T[i];head(t.title,1);app.innerHTML=`<div class="card">${t.guide}</div><button class="b" ${t.video||t.audio?'':'disabled'} onclick="media(${i})">${t.video||t.audio?'🎬 Video':'🎬 Video (tez orada)'}</button><button class="b" ${t.questions.length?'':'disabled'} onclick="startTopic(${i})">📝 Mavzu testi</button><button class="b g" onclick="guideList()">← Mavzular</button>`;scrollTo(0,0)}
function media(i){const t=T[i];head(t.title,1);let h='<div class="card">';const link=u=>/^https?:/.test(u);
if(t.video)h+=link(t.video)?`<a class="b" href="${E(t.video)}" target="_blank" rel="noopener">▶ Videoni ochish (internet kerak)</a>`:`<video controls playsinline preload="metadata" style="width:100%;border-radius:12px" src="${E(t.video)}"></video>`;
if(t.audio)h+=link(t.audio)?`<a class="b" href="${E(t.audio)}" target="_blank" rel="noopener">🔊 Audioni ochish (internet kerak)</a>`:`<p class="tag">🔊 Audio</p><audio controls preload="metadata" style="width:100%" src="${E(t.audio)}"></audio>`;
h+='</div>';app.innerHTML=h+`<button class="b" ${t.questions.length?'':'disabled'} onclick="startTopic(${i})">📝 Mavzu testi</button><button class="b g" onclick="guide(${i})">← Qo‘llanma</button>`;scrollTo(0,0)}
function testMenu(){head("Testlar",1);app.innerHTML=`<button class="b" onclick="topicTests()">📚 Mavzu bo‘yicha test</button><p class="tag" style="margin:0 0 14px">Bitta mavzu. Savollar va variantlar yuborilgan tartibda.</p><button class="b" onclick="testSetup()">🔀 Aralash test</button><p class="tag" style="margin:0">5 tagacha mavzu tanlanadi. Savollar aralash tushadi.</p><button class="b" style="margin-top:14px" onclick="timedSetup()">⏱ Vaqtli test (variantsiz)</button><p class="tag" style="margin:0">Variantlar yashirin, javobni o‘zingiz yozasiz. Har bir savolga 15, 30 yoki 40 soniya.</p>`}
function topicTests(){head("Mavzuni tanlang",1);app.innerHTML=T.map((t,i)=>`<button class="opt" ${t.questions.length?'':'disabled'} onclick="startTopic(${i})">${i+1}. ${E(t.title)} <small>(${t.questions.length||'testlar tez orada'})</small></button>`).join('')}
function startTopic(i){S.timed=false;S.mode='topic';S.sel=[i];S.q=[...T[i].questions];S.i=0;S.score=0;S.wrong=[];show()}
function again(){S.mode=='topic'?startTopic(S.sel[0]):S.mode=='timed'?startTimed():start()}
function testSetup(){head("Aralash test",1);S.sel=S.sel||[];S.n=S.n||10;
 app.innerHTML=`<p class="tag">Mavzularni tanlang (5 tagacha)</p>`+T.map((t,i)=>`<button class="opt ${S.sel.includes(i)?'sel':''}" ${t.questions.length?'':'disabled'} onclick="tog(${i})">${S.sel.includes(i)?'☑':'☐'} ${E(t.title)} <small>(${t.questions.length||'testlar tez orada'})</small></button>`).join('')+
 `<p class="tag">Savollar soni</p><div class="tabs">${[10,20,30,0].map(n=>`<button class="opt ${S.n==n?'sel':''}" onclick="S.n=${n};testSetup()">${n||'Hammasi'}</button>`).join('')}</div>
 <button class="b" ${S.sel.length?'':'disabled'} onclick="start()">Boshlash ▶</button>`}
function tog(i){const k=S.sel.indexOf(i);if(k>=0)S.sel.splice(k,1);else if(S.sel.length<5)S.sel.push(i);else alert("Eng ko‘pi bilan 5 ta mavzu");testSetup()}
function start(){S.timed=false;S.mode='mix';let q=[];S.sel.forEach(i=>T[i].questions.forEach(x=>q.push(x)));q=sh(q);if(S.n)q=q.slice(0,S.n);S.q=q;S.i=0;S.score=0;S.wrong=[];show()}
const cmp=s=>String(s).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'');
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[n]}
function bestOpt(inp,opts){const a=cmp(inp);if(!a)return -1;const ds=opts.map(o=>{const b=cmp(o);if(a==b)return 0;let d=lev(a,b)/Math.max(a.length,b.length);const r=Math.min(a.length,b.length)/Math.max(a.length,b.length);if(a.length>=5&&b.length>=5&&(b.includes(a)||a.includes(b))&&r>=.6)d=Math.min(d,.1);if(/^\d+$/.test(a)&&b.startsWith(a)&&b.length-a.length<=3)d=Math.min(d,.1);return d});const m=Math.min(...ds);if(m>.25)return -1;const near=ds.map((d,i)=>[d,i]).filter(x=>x[0]-m<.05);return near.length==1?near[0][1]:-1}
function longAns(q){const c=q.type=='single'?[q.options[q.answer]]:q.answer.map(i=>q.options[i]);return c.some(x=>x.length>45)}
function timedSetup(){head("Vaqtli test",1);S.sel=S.sel||[];S.n=S.n||10;S.sec=S.sec||30;
 app.innerHTML=`<p class="tag">Mavzularni tanlang (5 tagacha)</p>`+T.map((t,i)=>`<button class="opt ${S.sel.includes(i)?'sel':''}" ${t.questions.length?'':'disabled'} onclick="tog2(${i})">${S.sel.includes(i)?'☑':'☐'} ${E(t.title)} <small>(${t.questions.length||'testlar tez orada'})</small></button>`).join('')+
 `<p class="tag">Har bir savolga vaqt</p><div class="tabs">${[15,30,40].map(n=>`<button class="opt ${S.sec==n?'sel':''}" onclick="S.sec=${n};timedSetup()">${n} soniya</button>`).join('')}</div>
 <p class="tag">Savollar soni</p><div class="tabs">${[10,20,30,0].map(n=>`<button class="opt ${S.n==n?'sel':''}" onclick="S.n=${n};timedSetup()">${n||'Hammasi'}</button>`).join('')}</div>
 ${SR?`<p class="tag">Javob berish usuli</p><div class="tabs"><button class="opt ${vOn()?'sel':''}" onclick="S.vc=true;timedSetup()">🎤 Ovoz bilan</button><button class="opt ${!vOn()?'sel':''}" onclick="S.vc=false;timedSetup()">⌨ Yozib</button></div>`:'<p class="tag">🎤 Ovoz bilan javob berish bu brauzerda ishlamaydi (Chrome va internet kerak). Javobni yozasiz.</p>'}<p class="tag" style="margin-top:14px">Variantlar ko‘rinmaydi: javobni o‘zingiz aytasiz yoki yozasiz. Bitta mavzu tanlansa savollar tartib bilan, bir nechta bo‘lsa aralash chiqadi.</p>
 <button class="b" ${S.sel.length?'':'disabled'} onclick="startTimed()">Boshlash ▶</button>`}
function tog2(i){const k=S.sel.indexOf(i);if(k>=0)S.sel.splice(k,1);else if(S.sel.length<5)S.sel.push(i);else alert("Eng ko‘pi bilan 5 ta mavzu");timedSetup()}
function startTimed(){S.timed=true;S.mode='timed';let q=[];S.sel.forEach(i=>T[i].questions.forEach(x=>q.push(x)));if(S.sel.length>1)q=sh(q);if(S.n)q=q.slice(0,S.n);S.q=q;S.i=0;S.score=0;S.wrong=[];show()}
function tick(){if(S.done){clearInterval(S.iv);return}S.left--;const f=$('tb'),t=$('tm');if(f){f.style.width=Math.max(S.left,0)/S.sec*100+'%';f.classList.toggle('low',S.left<=5)}if(t)t.textContent='⏱ '+Math.max(S.left,0);if(S.left<=0){clearInterval(S.iv);S.to=true;check()}}
function show(){const q=S.q[S.i];S.done=false;S.a=null;S.alts=null;S.vtxt=null;head(`Savol ${S.i+1}/${S.q.length}`,1);
 let h=`<div class="bar"><i style="width:${S.i/S.q.length*100}%"></i></div>${S.timed?`<div class="bar"><i id="tb" style="width:100%"></i></div><div id="tm" class="tag">⏱ ${S.sec}</div>`:''}<div class="card"><div class="tag">${LBL[q.type]}</div><p>${E(q.q).replace('___','<b>_____</b>')}</p><div id="in">`;
 S.typed=!!S.timed&&(q.type=='single'||q.type=='multi')&&!longAns(q);
 if((q.type=='single'||q.type=='multi')&&!S.typed){S.opts=q.options.map((o,i)=>i);S.pick=[];h+=S.opts.map(i=>`<button class="opt" id="o${i}" onclick="pick(${i})">${q.type=='single'?'ABCDEFGHIJ'[i]+') ':(i+1)+') '}${E(q.options[i])}</button>`).join('')}
 if(S.typed)h+=q.type=='single'?`<input type="text" id="tx" autocomplete="off" autocapitalize="off" placeholder="Javobni yozing" onkeydown="if(event.key=='Enter'){event.preventDefault();check()}">`:`<textarea id="tx" rows="3" autocapitalize="off" placeholder="${q.answer.length} ta javobni vergul bilan ajratib yozing"></textarea>`;
 if(S.timed&&!S.typed&&(q.type=='single'||q.type=='multi'))h+=`<p class="tag">Javob uzun, shuning uchun variantlar ko‘rsatildi.</p>`;
 if(q.type=='tf')h+=`<button class="opt" id="o1" onclick="tfa(true)">To‘g‘ri</button><button class="opt" id="o0" onclick="tfa(false)">Noto‘g‘ri</button>`;
 if(q.type=='fill')h+=`<input type="text" id="f" autocomplete="off" placeholder="Javobni yozing">`;
 if(q.type=='match'){const r=sh(q.pairs.map(p=>p[1]));h+=q.pairs.map((p,i)=>`<p style="margin:10px 0 4px"><b>${E(p[0])}</b></p><select id="m${i}"><option value="">— tanlang —</option>${r.map(x=>`<option>${E(x)}</option>`).join('')}</select>`).join('')}
 if(q.type=='order'){S.pool=sh(q.items);S.seq=[];h+=`<div id="ord"></div>`}
 h+=`</div>${micUI(q)}</div><div id="fb"></div><button class="b" id="chk" onclick="check()">Tekshirish</button>`;app.innerHTML=h;if(q.type=='order')ordR();scrollTo(0,0);clearInterval(S.iv);if($('mic'))startRec();if(S.timed){S.left=S.sec;S.to=false;S.iv=setInterval(tick,1000);if(S.typed&&!vOn()){const x=$('tx');if(x)x.focus()}}}
function pick(i){if(S.done)return;const q=S.q[S.i];if(q.type=='single')S.pick=[i];else{const k=S.pick.indexOf(i);k>=0?S.pick.splice(k,1):S.pick.push(i)}
 S.opts.forEach(j=>$('o'+j).classList.toggle('sel',S.pick.includes(j)))}
function tfa(v){if(S.done)return;S.tf=v;$('o1').classList.toggle('sel',v);$('o0').classList.toggle('sel',!v)}
function ordR(){$('ord').innerHTML=`<p class="tag">Tanlangan tartib (olib tashlash uchun bosing):</p>`+S.seq.map((x,i)=>`<button class="opt sel" onclick="S.done||(S.pool.push(S.seq.splice(${i},1)[0]),ordR())">${i+1}. ${E(x)}</button>`).join('')+`<p class="tag">Variantlar:</p>`+S.pool.map((x,i)=>`<button class="opt" onclick="S.done||(S.seq.push(S.pool.splice(${i},1)[0]),ordR())">${E(x)}</button>`).join('')}
function check(){if(S.done){S.i++;return S.i<S.q.length?show():result()}clearInterval(S.iv);stopRec();
 const q=S.q[S.i];let ok=false,ans='',u='';
 if(q.type=='single'&&!S.typed){ok=S.pick[0]===q.answer;ans=q.options[q.answer];S.opts.forEach(j=>{if(j==q.answer)$('o'+j).classList.add('ok');else if(S.pick.includes(j))$('o'+j).classList.add('no')})}
 if(q.type=='multi'&&!S.typed){const a=[...q.answer].sort().join(),p=[...S.pick].sort().join();ok=a==p;ans=q.answer.map(i=>q.options[i]).join(', ');S.opts.forEach(j=>{const c=$('o'+j).classList;if(q.answer.includes(j))c.add('ok');else if(S.pick.includes(j))c.add('no')})}
 if(S.typed&&q.type=='single'){const v=$('tx').value;u=v.trim();ok=bestOpt(v,q.options)===q.answer||!!(S.vtxt===v&&S.alts&&S.alts.some(a=>bestOpt(a,q.options)===q.answer));ans=q.options[q.answer];$('tx').classList.add(ok?'ok':'no');$('tx').disabled=true}
 if(S.typed&&q.type=='multi'){const v=$('tx').value;u=v.trim();const vc=S.vtxt===v&&S.alts;const test=txt=>{const parts=txt.split(vc?/[,;\n]+|\s+va\s+|\s+hamda\s+/i:/[,;\n]+/).map(x=>x.trim()).filter(Boolean);const got=new Set(parts.map(x=>bestOpt(x,q.options)));return parts.length==q.answer.length&&got.size==q.answer.length&&q.answer.every(a=>got.has(a))};ok=test(v)||!!(vc&&S.alts.some(test));ans=q.answer.map(i=>q.options[i]).join(', ');$('tx').classList.add(ok?'ok':'no');$('tx').disabled=true}
 if(q.type=='tf'){ok=S.tf===q.answer;ans=q.answer?'To‘g‘ri':'Noto‘g‘ri';$('o'+(q.answer?1:0)).classList.add('ok');if(!ok&&S.tf!==undefined)$('o'+(S.tf?1:0)).classList.add('no')}
 if(q.type=='fill'){const fv=$('f').value;u=fv.trim();const v=norm(fv);ok=q.answer.some(a=>norm(a)==v)||!!(S.vtxt===fv&&S.alts&&S.alts.some(t=>q.answer.some(a=>norm(a)==norm(t))));ans=q.answer[0];$('f').classList.add(ok?'ok':'no')}
 if(q.type=='match'){ok=true;q.pairs.forEach((p,i)=>{const s=$('m'+i),g=s.value==p[1];if(!g)ok=false;s.classList.add(g?'ok':'no')});ans=q.pairs.map(p=>p[0]+' – '+p[1]).join('; ')}
 if(q.type=='order'){ok=S.seq.length==q.items.length&&S.seq.every((x,i)=>x==q.items[i]);ans=q.items.map((x,i)=>(i+1)+'. '+x).join('; ')}
 S.done=true;S.tf=undefined;const to=!ok&&!!S.to;S.to=false;if(ok)S.score++;else S.wrong.push({q:q.q,ans,u,to});
 $('fb').innerHTML=`<div class="card ${ok?'ok':'no'}"><b>${ok?'✅ To‘g‘ri!':to?'⏰ Vaqt tugadi':'❌ Noto‘g‘ri'}</b>${ok?'':`${u?`<br>Sizning javobingiz: ${E(u)}`:''}<br>To‘g‘ri javob: ${E(ans)}`}</div>`;
 sayA(ok,to,ans);$('chk').textContent=S.i+1<S.q.length?'Keyingisi ▶':'Natijani ko‘rish'}
function result(){head("Natija",1);const p=Math.round(S.score/S.q.length*100);clearInterval(S.iv);say("Natija: "+S.q.length+" ta savoldan "+S.score+" tasi to'g'ri. "+p+" foiz.");
 app.innerHTML=`<div class="card"><div class="big">${p}%</div><p style="text-align:center">${S.score} / ${S.q.length} to‘g‘ri</p>${S.timed?`<p class="tag" style="text-align:center">⏱ Har bir savolga ${S.sec} soniya · vaqt tugagan: ${S.wrong.filter(w=>w.to).length}</p>`:''}</div>`+
 (S.wrong.length?`<p class="tag">Xatolar:</p>`+S.wrong.map(w=>`<div class="card"><b>${E(w.q)}</b><br>${w.u?`Sizning javobingiz: ${E(w.u)}<br>`:''}${w.to?'⏰ Vaqt tugadi<br>':''}<span style="color:var(--ok)">${E(w.ans)}</span></div>`).join(''):'<div class="card">🎉 Hammasi to‘g‘ri!</div>')+
 `<button class="b" onclick="again()">🔁 Qayta boshlash</button><button class="b g" onclick="testMenu()">Test menyusi</button><button class="b g" onclick="go()">🏠 Bosh sahifa</button>`}
home();$('snd').textContent=SND?'🔊':'🔇';
</script>
